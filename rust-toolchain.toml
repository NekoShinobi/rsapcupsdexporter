[toolchain]
# Stable: the crate compiles on stable (verified) and CI installs stable via
# dtolnay/rust-toolchain@stable. Pinning it here means local dev, CI and the dev
# container all resolve the same compiler instead of each taking whatever their
# environment defaults to.
#
# The only nightly requirement is `-Zmin-publish-age` in `just deps-update`,
# which asks for it per invocation with `cargo +nightly`.
channel = "stable"
components = ["rustfmt", "clippy"]
