services:
  rsapcupsdexporter:
    build: .
    ports:
      - "9090:9090"
    environment:
      - RUST_LOG=info
      # Comma-separated list of host or host:port targets, e.g.
      # APCUPSD_TARGETS=192.168.1.100:3551,192.168.1.101:3551
      - APCUPSD_TARGETS=${APCUPSD_TARGETS:-${APCUPSD_HOST}}
      - APCUPSD_PORT=3551
      - INTERVAL=10
      - TIMEOUT=15
      - METRICS_PORT=9090
